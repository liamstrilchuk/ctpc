<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>{% block title %}Canadian Team Programming Competition{% endblock %}</title>
		<meta name="description" content="{% block meta_description %}CTPC runs coding competitions and events like #Launch to make building and problem-solving accessible for students across Canada.{% endblock %}">

		<link rel="icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
		<link rel="stylesheet" href="{{ url_for('static', filename='css/public.css') }}">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">

		{% block head %}{% endblock %}
	</head>
	<body class="pub-body">
		<a class="pub-skip-link" href="#pub-main-content">Skip to content</a>

		<nav class="pub-nav" aria-label="Primary">
			<a class="pub-nav-brand" href="/">
				<img src="{{ url_for('static', filename='images/homepage/ctpclogo.png') }}" alt="CTPC logo">
				<span>CTPC</span>
			</a>
			<button class="pub-hamburger" id="pub-nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="pub-nav-links">
				<span class="fa fa-bars" aria-hidden="true"></span>
			</button>
			<div class="pub-nav-links" id="pub-nav-links">
				<a href="/about" {% if active_page == "about" %}aria-current="page"{% endif %}>About</a>
				<a href="/timeline" {% if active_page == "timeline" %}aria-current="page"{% endif %}>Timeline</a>
				<a href="/platform" {% if active_page == "platform" %}aria-current="page"{% endif %}>Platform</a>
				<a href="/contact" {% if active_page == "contact" %}aria-current="page"{% endif %}>Contact</a>
				<a href="/login">Login</a>
				<a href="/competitions/2025" class="pub-nav-cta">Enter 2025 Competition</a>
			</div>
		</nav>

		<main id="pub-main-content" tabindex="-1">
			{% block content %}{% endblock %}
		</main>

		<footer class="pub-footer">
			<div>&copy; 2025 CTPC organizers</div>
			<div><a href="/contact">Contact us</a> &bull; <a href="https://instagram.com/ctpc.ca">Instagram</a></div>
		</footer>

		<script src="{{ url_for('static', filename='js/public.js') }}"></script>
		{% block scripts %}{% endblock %}
	</body>
</html>
